<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet, noimageindex">
<meta name="googlebot" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>SVOi — Kitchen Production</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --cream:#FAF6EF; --dark:#1C1612; --gold:#A07840; --gold-light:#C9A96E;
  --gold-pale:#F0E4CC; --warm-dark:#D4C4A8;
  --muted:#8C7B6A; --green:#3A6B45; --green-bg:#EAF3EC;
  --border:#D4C4A8;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:'DM Sans',sans-serif;background:var(--cream);color:var(--dark);min-height:100vh;padding-bottom:120px}

/* LANG */
.lang-toggle{display:inline-flex;border:1px solid rgba(201,169,110,0.4);border-radius:8px;overflow:hidden}
.lang-opt{font-family:'DM Sans',sans-serif;font-size:12px;font-weight:600;padding:5px 11px;cursor:pointer;background:transparent;border:none;color:var(--gold-light);transition:all .2s}
.lang-opt.active{background:var(--gold);color:#1C1612}

/* LOCATION */
.loc-screen{position:fixed;inset:0;background:var(--dark);z-index:500;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 24px;text-align:center}
.loc-screen.hidden{display:none}
.loc-lang{position:absolute;top:20px;right:20px}
.loc-logo{font-family:'Cormorant Garamond',serif;font-size:28px;font-weight:700;color:#F5EDD8;letter-spacing:3px;margin-bottom:6px}
.loc-sub{font-size:12px;color:var(--gold-light);letter-spacing:2px;text-transform:uppercase;margin-bottom:44px}
.loc-title{font-family:'Cormorant Garamond',serif;font-size:20px;color:var(--gold-light);margin-bottom:22px;font-style:italic}
.loc-list{display:flex;flex-direction:column;gap:10px;width:100%;max-width:340px}
.loc-btn{background:rgba(255,255,255,0.07);border:1.5px solid rgba(201,169,110,0.3);border-radius:14px;padding:16px 18px;cursor:pointer;transition:all .2s;display:flex;align-items:center;gap:14px;text-align:left}
.loc-btn:active{transform:scale(.97)}
.loc-dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
.loc-btn-name{font-family:'Cormorant Garamond',serif;font-size:18px;color:#F5EDD8;font-weight:600}
.loc-btn-addr{font-size:12px;color:var(--muted);margin-top:2px}

/* HEADER */
.app-header{background:var(--dark);padding:18px 20px 14px;position:sticky;top:0;z-index:100;box-shadow:0 2px 20px rgba(28,22,18,.3)}
.header-top{display:flex;justify-content:space-between;align-items:flex-start}
.header-left{display:flex;align-items:center;gap:10px}
.loc-indicator{width:10px;height:10px;border-radius:50%;flex-shrink:0;margin-top:3px}
.app-header h1{font-family:'Cormorant Garamond',serif;font-size:20px;font-weight:700;color:#F5EDD8;letter-spacing:2px;text-transform:uppercase}
.app-header .subtitle{font-size:11px;color:var(--gold-light);letter-spacing:1px;text-transform:uppercase;margin-top:1px}
.change-loc-btn{font-size:10px;color:var(--gold-light);background:rgba(255,255,255,.08);border:1px solid rgba(201,169,110,.3);border-radius:5px;padding:2px 7px;cursor:pointer;margin-left:4px;display:inline-block}
.header-right{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
#clock{font-family:'Cormorant Garamond',serif;font-size:21px;color:var(--gold-light);font-weight:600}
.log-btn{font-size:10px;color:var(--gold-light);letter-spacing:1px;text-transform:uppercase;background:rgba(255,255,255,.08);border:1px solid rgba(201,169,110,.3);border-radius:6px;padding:4px 10px;cursor:pointer}

/* BAKER */
.baker-section{margin:14px 16px 0;background:#fff;border-radius:12px;padding:15px 18px;border:1px solid var(--border);box-shadow:0 1px 6px rgba(28,22,18,.06)}
.baker-section label{display:block;font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);margin-bottom:5px}
.baker-section input{width:100%;border:none;border-bottom:2px solid var(--gold-pale);background:transparent;font-family:'Cormorant Garamond',serif;font-size:19px;color:var(--dark);padding:3px 0 7px;outline:none;transition:border-color .2s}
.baker-section input:focus{border-bottom-color:var(--gold)}
.baker-section input::placeholder{color:var(--gold-pale);font-style:italic}
.baker-note{margin-top:9px;font-size:12px;color:var(--muted);font-style:italic}

/* HINT */
.hint-card{margin:12px 16px 0;background:#FFF9EC;border:1px solid var(--gold-pale);border-radius:12px;padding:12px 15px;font-size:13px;color:#7A5010;line-height:1.5}

/* GROUPS */
.wrap{padding:14px 16px;display:flex;flex-direction:column;gap:12px}
.group-card{background:#fff;border-radius:14px;border:1.5px solid var(--border);overflow:hidden;box-shadow:0 1px 6px rgba(28,22,18,.05)}
.group-head{font-size:10px;letter-spacing:1.8px;text-transform:uppercase;color:var(--gold);padding:12px 15px 2px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;padding:8px 15px 14px}
.cell{background:var(--cream);border-radius:8px;border:1px solid var(--border);overflow:hidden;transition:border-color .2s,background .2s}
.cell.filled{border-color:var(--green);background:var(--green-bg)}
.cell label{display:block;font-size:9px;letter-spacing:.5px;text-transform:uppercase;color:var(--muted);padding:6px 6px 1px;line-height:1.2;min-height:26px}
.cell input{display:block;width:100%;border:none;background:transparent;font-family:'Cormorant Garamond',serif;font-size:26px;font-weight:600;color:var(--dark);padding:0 8px 4px;outline:none;text-align:center}
.cell input::placeholder{color:var(--gold-pale)}
.unit{font-size:8px;letter-spacing:1px;text-transform:uppercase;color:var(--gold-light);text-align:center;padding:0 0 6px}

/* NOTES */
.notes-row{margin:0 16px;padding:14px 16px;background:#fff;border:1px solid var(--border);border-radius:12px}
.notes-row label{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px}
.notes-row input{width:100%;border:none;border-bottom:2px solid var(--gold-pale);background:transparent;font-size:14px;color:var(--dark);padding:4px 0 7px;outline:none;font-family:'DM Sans',sans-serif}
.notes-row input:focus{border-bottom-color:var(--gold)}

/* SUBMIT */
.submit-footer{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--border);padding:12px 16px;box-shadow:0 -4px 20px rgba(28,22,18,.08);z-index:100}
.total-line{font-size:12px;color:var(--muted);text-align:center;margin-bottom:8px}
.total-line b{color:var(--dark);font-size:14px}
.submit-btn{width:100%;background:var(--dark);color:#F5EDD8;border:none;border-radius:12px;padding:15px;font-family:'Cormorant Garamond',serif;font-size:18px;font-weight:600;letter-spacing:2px;text-transform:uppercase;cursor:pointer;transition:all .3s;opacity:.4;pointer-events:none}
.submit-btn.ready{opacity:1;background:var(--green);box-shadow:0 4px 16px rgba(58,107,69,.3);pointer-events:all}
.submit-btn.ready:active{transform:scale(.98)}

/* DONE */
.done-screen{display:none;position:fixed;inset:0;background:var(--dark);z-index:200;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:40px}
.done-screen.show{display:flex}
.done-check{width:76px;height:76px;background:var(--green);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:22px;animation:popIn .5s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.done-screen h2{font-family:'Cormorant Garamond',serif;font-size:30px;color:#F5EDD8;margin-bottom:8px}
.done-loc-badge{font-size:12px;letter-spacing:1.5px;text-transform:uppercase;border-radius:6px;padding:4px 12px;margin-bottom:10px;display:inline-block}
.done-name{font-family:'Cormorant Garamond',serif;font-size:17px;color:var(--gold-light);font-style:italic;margin-bottom:4px}
.done-stamp{font-size:13px;color:var(--muted);background:rgba(255,255,255,.05);border-radius:8px;padding:9px 18px;margin-top:6px}
.saving-indicator{font-size:12px;color:var(--gold-light);margin-top:10px;min-height:18px}
.done-actions{display:flex;flex-direction:column;gap:10px;margin-top:22px;width:100%;max-width:300px}
.done-btn{border-radius:10px;padding:13px 20px;font-size:14px;cursor:pointer;border:none;font-family:'DM Sans',sans-serif;background:rgba(255,255,255,.1);color:#F5EDD8}
.done-btn:active{transform:scale(.97)}
</style>
</head>
<body>
<!-- ═══════════ SVOi ACCESS GATE v2 · 2026-08-22 ═══════════
     Персональные коды. Список людей и кодов — в таблице SVOi HQ,
     лист "Staff". Удалили строку → код перестал работать.
     Здесь ничего править не нужно.
════════════════════════════════════════════════════════════ -->
<script>
(function(){
'use strict';

/* Адрес скрипта, который проверяет коды (лист Staff) */
var AUTH_URL = 'https://script.google.com/macros/s/AKfycbzloq27LS71H__5cR3_EqkMCvXYA05Zbdq93paVGekd8Vk91jtN3AK2oIE5ZchYSMSG/exec';
var KEY = 'svoi_access_v2';

var _fetch = window.fetch;

/* ── что сохранено на этом устройстве ── */
var saved = null;
try { saved = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e){}
if (saved && (!saved.pin || !saved.name)) saved = null;

window.SVOI_USER = saved ? saved.name : '';

function remember(v){
  saved = v;
  window.SVOI_USER = v ? v.name : '';
  try { v ? localStorage.setItem(KEY, JSON.stringify(v)) : localStorage.removeItem(KEY); } catch(e){}
}

/* ── к каждому запросу в журнал подставляем код ── */
window.fetch = function(u, o){
  try{
    var url = (typeof u === 'string') ? u : ((u && u.url) || '');
    var pin = saved ? saved.pin : '';
    if (pin && url.indexOf('script.google.com') > -1){
      if (o && typeof o.body === 'string' && o.body.charAt(0) === '{'){
        var d = JSON.parse(o.body); d.pin = pin; o.body = JSON.stringify(d);
      } else if (!o || !o.method || String(o.method).toUpperCase() === 'GET'){
        u = url + (url.indexOf('?') > -1 ? '&' : '?') + 'pin=' + encodeURIComponent(pin);
      }
    }
  }catch(e){}
  return _fetch.apply(this, [u, o]);
};

/* ── спросить у сервера, чей это код ──
   имя      — код действителен
   null     — кода нет в таблице или человек отключён
   undefined— сеть не ответила                                   */
function ask(code, cb){
  _fetch(AUTH_URL + '?action=auth&pin=' + encodeURIComponent(code), { method: 'GET' })
    .then(function(r){ return r.json(); })
    .then(function(j){ cb(j && j.ok ? String(j.name || '') : null); })
    .catch(function(){ cb(undefined); });
}

/* ══════════════ экран ввода кода ══════════════ */

var css = document.createElement('style');
css.textContent =
'#svoiGate{position:fixed;inset:0;z-index:2147483647;background:linear-gradient(160deg,#1B4F72,#153E5C);'+
'display:flex;align-items:center;justify-content:center;padding:24px;'+
'font:400 16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Arial,sans-serif;'+
'-webkit-tap-highlight-color:transparent}'+
'#svoiGate .gb{width:100%;max-width:320px;text-align:center;color:#fff}'+
'#svoiGate .gl{font-size:30px;font-weight:700;letter-spacing:2px;margin-bottom:6px}'+
'#svoiGate .gs{font-size:13.5px;opacity:.75;margin-bottom:26px}'+
'#svoiGate .gd{display:flex;gap:13px;justify-content:center;margin-bottom:26px}'+
'#svoiGate .gd i{width:15px;height:15px;border-radius:50%;background:rgba(255,255,255,.22);'+
'transition:background .15s,transform .15s}'+
'#svoiGate .gd i.f{background:#fff;transform:scale(1.12)}'+
'#svoiGate .gk{display:grid;grid-template-columns:repeat(3,1fr);gap:13px}'+
'#svoiGate .gk button{height:66px;border:0;border-radius:16px;background:rgba(255,255,255,.13);'+
'color:#fff;font-size:26px;font-weight:600;font-variant-numeric:tabular-nums;cursor:pointer;'+
'transition:background .12s,transform .08s}'+
'#svoiGate .gk button:active{background:rgba(255,255,255,.3);transform:scale(.95)}'+
'#svoiGate .gk button.gx{background:transparent;font-size:21px;opacity:.75}'+
'#svoiGate.busy .gk{opacity:.4;pointer-events:none}'+
'#svoiGate .ge{min-height:38px;margin-top:20px;font-size:13.5px;color:#FFC9C2;opacity:0;transition:opacity .2s}'+
'#svoiGate .ge.on{opacity:1}'+
'#svoiGate .ge.good{color:#B8F0C8;font-size:17px;font-weight:600}'+
'#svoiGate.shake{animation:svoiShake .38s}'+
'@keyframes svoiShake{0%,100%{transform:translateX(0)}20%{transform:translateX(-11px)}'+
'40%{transform:translateX(11px)}60%{transform:translateX(-7px)}80%{transform:translateX(7px)}}';
document.head.appendChild(css);

var g = document.createElement('div');
g.id = 'svoiGate';
g.innerHTML =
'<div class="gb">'+
  '<div class="gl">SVOi</div>'+
  '<div class="gs">Enter your personal code &middot; Введіть свій код</div>'+
  '<div class="gd"><i></i><i></i><i></i><i></i></div>'+
  '<div class="gk">'+
    '<button>1</button><button>2</button><button>3</button>'+
    '<button>4</button><button>5</button><button>6</button>'+
    '<button>7</button><button>8</button><button>9</button>'+
    '<button class="gx" data-a="c">C</button><button>0</button>'+
    '<button class="gx" data-a="d">&#9003;</button>'+
  '</div>'+
  '<div class="ge"></div>'+
'</div>';

var dots = g.querySelectorAll('.gd i');
var msg  = g.querySelector('.ge');
var buf  = '';

function paint(){
  for (var i = 0; i < dots.length; i++) dots[i].className = (i < buf.length) ? 'f' : '';
}
function say(text, good){ msg.textContent = text; msg.className = 'ge on' + (good ? ' good' : ''); }
function quiet(){ msg.className = 'ge'; }

function fail(text){
  say(text || 'Wrong code · Невірний код');
  g.className = 'shake';
  setTimeout(function(){ g.className = ''; }, 400);
  buf = ''; paint();
}

function show(){
  if (g.parentNode) return;
  buf = ''; paint(); quiet();
  g.className = '';
  document.body.appendChild(g);
  document.documentElement.style.overflow = 'hidden';
}

function hide(){
  document.documentElement.style.overflow = '';
  if (g.parentNode) g.parentNode.removeChild(g);
}

function submit(code){
  g.className = 'busy';
  say('…');
  ask(code, function(name){
    g.className = '';
    if (name === undefined){ fail('No internet · Немає інтернету'); return; }
    if (name === null){ fail(); return; }
    remember({ pin: code, name: name });
    say('Hi, ' + name, true);
    setTimeout(hide, 750);
  });
}

function type(ch){
  if (buf.length >= 4) return;
  quiet();
  buf += ch;
  paint();
  if (buf.length === 4){ var code = buf; setTimeout(function(){ submit(code); }, 160); }
}

g.addEventListener('click', function(ev){
  var b = ev.target.closest ? ev.target.closest('button') : null;
  if (!b) return;
  var a = b.getAttribute('data-a');
  if (a === 'c'){ buf = ''; quiet(); paint(); return; }
  if (a === 'd'){ buf = buf.slice(0, -1); quiet(); paint(); return; }
  type(b.textContent.trim());
});

document.addEventListener('keydown', function(ev){
  if (!g.parentNode) return;
  if (ev.key >= '0' && ev.key <= '9') type(ev.key);
  else if (ev.key === 'Backspace'){ buf = buf.slice(0, -1); paint(); }
});

/* ══════════════ запуск ══════════════ */

/* Код уже есть — открываем сразу, не заставляя ждать сеть.
   Параллельно спрашиваем сервер: если человека убрали из таблицы,
   экран кода появляется прямо сейчас. Заполненное на странице
   остаётся на месте — отправить его без действующего кода нельзя. */
function revalidate(){
  if (!saved || !navigator.onLine) return;
  ask(saved.pin, function(name){
    if (name === null){ remember(null); show(); }
    else if (name && saved){ remember({ pin: saved.pin, name: name }); }
  });
}

function start(){
  if (saved) revalidate();
  else show();
}

if (document.body) start();
else document.addEventListener('DOMContentLoaded', start);

})();
</script>
<!-- ═════════ END SVOi ACCESS GATE v2 ═════════ -->

<script>

function getScriptUrl() { return localStorage.getItem('svoi-script-url') || DEFAULT_SCRIPT_URL; }

// ── TRANSLATIONS ──────────────────────────────────────────
const T = {

const COLORS = ["#4A6FA5","#A07840","#6B4A8C","#3A6B45","#8B4A3A","#4A7B6B"];
let locations = JSON.parse(localStorage.getItem('svoi-locations') || 'null') || [
  { id:"loc1", name:"Central West End", addr:"8 S Euclid Ave, St. Louis", color:"#4A6FA5" }
];
let currentLoc = null;

// ── LANG ──────────────────────────────────────────────────
function applyStaticLang(){
  document.documentElement.lang = LANG;
  document.querySelectorAll('[data-i18n]').forEach(el=>{
    const k=el.getAttribute('data-i18n');
    if (T[LANG][k]!==undefined && typeof T[LANG][k]==='string') el.innerHTML=T[LANG][k];
  });
  document.querySelectorAll('[data-i18n-ph]').forEach(el=>{
    const k=el.getAttribute('data-i18n-ph');
    if (T[LANG][k]!==undefined) el.placeholder=T[LANG][k];
  });
  document.querySelectorAll('.lang-opt').forEach(b=>b.classList.toggle('active', b.getAttribute('data-lang')===LANG));
}
function setLang(l){
  LANG=l; localStorage.setItem('svoi-lang',l);
  applyStaticLang(); renderLocPicker();
  if (currentLoc) rebuildKeepingValues();
  updateTotal();
}
function rebuildKeepingValues(){
  const vals={};
  document.querySelectorAll('.inv-input').forEach(i=>{ if(i.value) vals[i.dataset.name]=i.value; });
  buildUI();
  document.querySelectorAll('.inv-input').forEach(i=>{
    if (vals[i.dataset.name]) { i.value=vals[i.dataset.name]; i.closest('.cell').classList.add('filled'); }
  });
  updateTotal();
}

// ── LOCATIONS ─────────────────────────────────────────────
function renderLocPicker(){
  const list=document.getElementById('locList'); list.innerHTML='';
  locations.forEach(loc=>{
    const b=document.createElement('div'); b.className='loc-btn';
    b.innerHTML=`<div class="loc-dot" style="background:${loc.color}"></div><div><div class="loc-btn-name">${loc.name}</div>${loc.addr?`<div class="loc-btn-addr">${loc.addr}</div>`:''}</div>`;
    b.onclick=()=>selectLocation(loc);
    list.appendChild(b);
  });
}
function selectLocation(loc){
  currentLoc=loc;
  document.getElementById('locScreen').classList.add('hidden');
  document.getElementById('locIndicator').style.background=loc.color;
  document.getElementById('headerTitle').textContent=loc.name;
  buildUI(); updateTotal();
}
function changeLoc(){ document.getElementById('locScreen').classList.remove('hidden'); renderLocPicker(); }

// ── BUILD ─────────────────────────────────────────────────
function buildUI(){
  const wrap=document.getElementById('wrap'); wrap.innerHTML='';
  DISPLAY.forEach(grp=>{
    const card=document.createElement('div'); card.className='group-card';
    const head=document.createElement('div'); head.className='group-head';
    head.textContent=grp.group[LANG]+' · '+grp.unit[LANG];
    card.appendChild(head);
    const grid=document.createElement('div'); grid.className='grid';
    grp.items.forEach(d=>{
      const c=document.createElement('div'); c.className='cell';
      c.innerHTML=`<label>${d[LANG]}</label><input type="number" class="inv-input" data-group="${grp.group.en}" data-name="${d.en}" data-unit="${grp.unit.en}" placeholder="0" min="0" inputmode="numeric"><div class="unit">${grp.unit[LANG]}</div>`;
      const inp=c.querySelector('input');
      inp.addEventListener('input',()=>{
        c.classList.toggle('filled', Number(inp.value)>0);
        updateTotal();
      });
      grid.appendChild(c);
    });
    card.appendChild(grid);
    wrap.appendChild(card);
  });
}

function collectItems(){
  const out=[];
  document.querySelectorAll('.inv-input').forEach(inp=>{
    const v=Number((inp.value||'').trim());
    if (v>0) out.push({ group:inp.dataset.group, name:inp.dataset.name, unit:inp.dataset.unit, count:v });
  });
  return out;
}
function updateTotal(){
  const items=collectItems();
  const total=items.reduce((s,i)=>s+i.count,0);
  const el=document.getElementById('totalLine');
  el.textContent = items.length ? T[LANG].totalLine(total, items.length) : t('nothing');
  document.getElementById('submitBtn').classList.toggle('ready', items.length>0);
}

// ── SUBMIT ────────────────────────────────────────────────
async function handleSubmit(){
  const items=collectItems();
  if (!items.length) return;
  const baker=document.getElementById('baker').value.trim() || 'Kitchen';
  const notes=(document.getElementById('kitchenNotes').value||'').trim();
  const now=new Date();
  const entry={
    type:'production',
    locId:currentLoc.id,
    locName:currentLoc.name,
    locColor:currentLoc.color,
    date:now.toLocaleDateString('en-US',{weekday:'short',month:'short',day:'numeric',year:'numeric'}),
    time:now.toLocaleTimeString('en-US',{hour:'2-digit',minute:'2-digit'}),
    baker,
    items,
    notes,
    ts:now.getTime()
  };

  document.getElementById('doneLocBadge').textContent=currentLoc.name;
  document.getElementById('doneLocBadge').style.background=currentLoc.color+'22';
  document.getElementById('doneLocBadge').style.color=currentLoc.color;
  document.getElementById('doneName').textContent=baker;
  document.getElementById('doneStamp').textContent=`${entry.date}  ·  ${entry.time}`;
  document.getElementById('savingIndicator').textContent=t('savingSheets');
  document.getElementById('doneScreen').classList.add('show');

  try{
    await fetch(getScriptUrl(), { method:'POST', mode:'no-cors', headers:{'Content-Type':'application/json'}, body:JSON.stringify(entry) });
    document.getElementById('savingIndicator').textContent=t('savedSheets');
  }catch(e){
    document.getElementById('savingIndicator').textContent=t('savedError');
  }
}

function resetAll(){
  document.getElementById('doneScreen').classList.remove('show');
  document.getElementById('kitchenNotes').value='';
  buildUI(); updateTotal();
}
